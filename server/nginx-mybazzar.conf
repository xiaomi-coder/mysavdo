# ══════════════════════════════════════════════════════════════════════════
# MyBazzar — nginx sayti
#
#   mybazzar.uz                 → ilova (kassa, ombor, hisobotlar)
#   <dokon>.mybazzar.uz         → o'sha do'konning onlayn katalogi
#   mybazzar.uz/rest/v1/        → PostgREST (127.0.0.1:3002)
#   mybazzar.uz/api/upload.php  → mahsulot rasmini yuklash
#   mybazzar.uz/uploads/        → yuklangan rasmlar (statik)
#
# Subdomainni frontend o'zi taniydi (src/utils/storeHost.js) — nginx
# hamma subdomainga bir xil fayllarni beradi.
#
# Sertifikat: wildcard, certbot dns-cloudflare orqali olingan.
# nginx plaginini ISHLATMANG — u umumiy nginx.conf ni buzadi va
# bekbags.uz bilan api.eduprocrm.uz ni ham to'xtatib qo'yadi.
# ══════════════════════════════════════════════════════════════════════════

# ── HTTP: sertifikat tekshiruvi va HTTPS ga yo'naltirish ─────────────────
server {
    listen 80;
    listen [::]:80;
    server_name mybazzar.uz *.mybazzar.uz;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    # $host saqlanadi — subdomain o'z manziliga qaytadi, apex ga emas
    location / { return 301 https://$host$request_uri; }
}

# ── HTTP: IP orqali kirilsa asosiy domenga ───────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name 138.249.7.47;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://mybazzar.uz$request_uri; }
}

# ── www → asosiy domen ───────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.mybazzar.uz;

    ssl_certificate     /etc/letsencrypt/live/mybazzar-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mybazzar-wildcard/privkey.pem;

    return 301 https://mybazzar.uz$request_uri;
}

# ── HTTPS: ilova va do'kon subdomainlari ─────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mybazzar.uz *.mybazzar.uz;

    ssl_certificate     /etc/letsencrypt/live/mybazzar-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mybazzar-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/mybazzar;
    index index.html;

    access_log /var/log/nginx/mybazzar.access.log;
    error_log  /var/log/nginx/mybazzar.error.log;

    client_max_body_size 10M;

    # ── API: Supabase REST => PostgREST ──────────────────────────────────
    location /rest/v1/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "authorization, apikey, content-type, prefer, range, x-client-info, accept-profile, content-profile, x-upsert" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type "text/plain";
            return 204;
        }

        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Profile" always;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:3002/;
    }

    # ── Mahsulot rasmlari ────────────────────────────────────────────────
    # Yuklash: PHP endpoint. Fayllar alohida papkada va faqat statik
    # sifatida beriladi — u yerda PHP hech qachon bajarilmaydi.
    location = /api/upload.php {
        limit_req zone=mbupload burst=5 nodelay;
        client_max_body_size 3M;

        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/mybazzar-api/upload.php;
        include fastcgi_params;
    }

    location /uploads/ {
        alias /var/www/mybazzar-uploads/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
        location ~ \.(php|phtml|phar)$ { return 403; }
    }

    # ── Statik fayllar: nomida hash bor, uzoq keshlash xavfsiz ───────────
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── React Router: har qanday yo'l index.html ga tushadi ──────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
