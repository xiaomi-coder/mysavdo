# ══════════════════════════════════════════════════════════════════════════
# MyBazzar — nginx sayti
#
# Bir manzilning o'zida:
#   /            → React ilova (statik fayllar)
#   /rest/v1/    → PostgREST (127.0.0.1:3002) — Supabase URL strukturasi
#
# Frontend va API bir xil manzilda bo'lgani uchun CORS muammosi yo'q.
#
# Sertifikat: certbot certonly --webroot (nginx plagini EMAS — u umumiy
# nginx.conf ni tahrirlab, server_names_hash_bucket_size takrorlanishiga
# olib keladi va boshqa saytlarni ham to'xtatib qo'yadi).
# ══════════════════════════════════════════════════════════════════════════

# ── HTTP (80): faqat sertifikat tekshiruvi va HTTPS ga yo'naltirish ──────
server {
    listen 80;
    listen [::]:80;
    server_name mybazzar.uz www.mybazzar.uz 138.249.7.47;

    # Let's Encrypt yangilanishi shu yo'l orqali o'tadi — yo'naltirishdan oldin
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # IP orqali kirilsa ham domenga o'tkazamiz: shifrlanmagan sahifada
    # parol kiritilmasligi uchun.
    location / { return 301 https://mybazzar.uz$request_uri; }
}

# ── www → asosiy domen ───────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.mybazzar.uz;

    ssl_certificate     /etc/letsencrypt/live/mybazzar.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mybazzar.uz/privkey.pem;

    return 301 https://mybazzar.uz$request_uri;
}

# ── HTTPS (443): asosiy sayt ─────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mybazzar.uz;

    ssl_certificate     /etc/letsencrypt/live/mybazzar.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mybazzar.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/mybazzar;
    index index.html;

    access_log /var/log/nginx/mybazzar.access.log;
    error_log  /var/log/nginx/mybazzar.error.log;

    client_max_body_size 10M;

    # ── API: Supabase REST => PostgREST ──────────────────────────────────
    location /rest/v1/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "authorization, apikey, content-type, prefer, range, x-client-info, accept-profile, content-profile, x-upsert" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type "text/plain";
            return 204;
        }

        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Profile" always;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:3002/;
    }

    # ── Statik fayllar: nomida hash bor, uzoq keshlash xavfsiz ───────────
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── React Router: har qanday yo'l index.html ga tushadi ──────────────
    # index.html keshlanmaydi, aks holda yangilanish ko'rinmay qoladi.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
